# Pruebas y despliegue.
#
# - test: en cada push (a cualquier rama) y en cada PR. Tipos, lint, la prueba
#   de cifrado de Web Push y el e2e completo con Playwright contra el bundle
#   real de Workers en local (D1 y R2 simulados, sin tocar producción).
# - deploy: solo en main, y solo si test ha pasado. Aplica las migraciones de
#   D1 pendientes (idempotente) y despliega el Worker.
#
# El deploy necesita en Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (secret)  token con permisos de Workers Scripts,
#                                    D1 y R2 (edición) sobre la cuenta
#   CLOUDFLARE_ACCOUNT_ID  (secret o variable)  id de la cuenta
# El job de test no usa ningún secret.
name: Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # La imagen de Playwright ya trae el navegador y sus librerías; instalarlos
  # en cada run llevaba 6-7 minutos. Su versión tiene que coincidir con la del
  # paquete `playwright` del lockfile, así que se lee de ahí.
  playwright:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

  test:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # Sin esto se usa la 22.x que traiga la imagen del runner, que puede
          # ir por detrás de los parches de seguridad de Node.
          check-latest: true
          cache: npm

      - run: npm ci

      - name: Tipos y lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Cifrado de Web Push
        run: node scripts/push-selftest.mjs

      # Claves VAPID de usar y tirar, solo para este run: así el e2e prueba
      # también la API de notificaciones.
      - name: Preparar entorno local
        run: |
          { node scripts/vapid.mjs | grep '^VAPID_'; echo "VAPID_SUBJECT=mailto:e2e@example.com"; } > .dev.vars
          npm run db:local
          npx opennextjs-cloudflare build

      - name: e2e
        run: |
          npx opennextjs-cloudflare preview > preview.log 2>&1 &
          # Espera a que el servidor responda (la imagen no trae curl).
          node -e '
            const t0 = Date.now();
            (async function wait() {
              try { await fetch("http://localhost:8787/login"); process.exit(0); }
              catch { if (Date.now() - t0 > 180000) process.exit(1); setTimeout(wait, 2000); }
            })();'
          node e2e.mjs

      # Si algo falla: las capturas de cada paso y el log del servidor.
      - name: Capturas y log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            /tmp/lista-compra-e2e/shots
            preview.log
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Comprobar credenciales
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN en el repo"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Falta CLOUDFLARE_ACCOUNT_ID (secret o variable) en el repo"
            exit 1
          fi

      - run: npm ci

      # A qué cuentas tiene acceso el token. GitHub tapa con *** el valor de
      # CLOUDFLARE_ACCOUNT_ID, así que la cuenta configurada sale como ***:
      # si no aparece ninguna fila con ***, el token no tiene acceso a ella.
      - name: Cuenta de Cloudflare
        run: npx wrangler whoami

      - name: Migraciones D1
        run: npm run db:remote

      - name: Deploy
        run: npm run deploy
