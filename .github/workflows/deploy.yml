# Despliega a Cloudflare cada vez que algo entra en main (o a mano desde la
# pestaña Actions). Primero aplica las migraciones de D1 pendientes, que es
# idempotente, y luego hace el build de OpenNext y el deploy del Worker.
#
# Necesita en Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (secret)  token con permisos de Workers Scripts,
#                                    D1 y R2 (edición) sobre la cuenta
#   CLOUDFLARE_ACCOUNT_ID  (secret o variable)  id de la cuenta
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Comprobar credenciales
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN en el repo"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Falta CLOUDFLARE_ACCOUNT_ID (secret o variable) en el repo"
            exit 1
          fi

      - run: npm ci

      - name: Tipos y lint
        run: |
          npx tsc --noEmit
          npm run lint

      # A qué cuentas tiene acceso el token. GitHub tapa con *** el valor de
      # CLOUDFLARE_ACCOUNT_ID, así que la cuenta configurada sale como ***:
      # si no aparece ninguna fila con ***, el token no tiene acceso a ella.
      - name: Cuenta de Cloudflare
        run: npx wrangler whoami

      - name: Migraciones D1
        run: npm run db:remote

      - name: Deploy
        run: npm run deploy
